name: Weekly Commodity COT & GEX Update

on:
  schedule:
    # Runs every Saturday at 01:30 UTC (10:30 AM JST) after CFTC COT release
    - cron: '30 1 * * 6'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-dashboard-and-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline (Data Fetch -> Signal -> Build Docs -> Send LINE)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py

      - name: Commit and Push Updated Data & Dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update COT data, signals, and dashboard [skip ci]"
            git push
          fi
